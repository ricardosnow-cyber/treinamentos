<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Studio IA de Treinamentos</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2f80ed;
      --primary-dark: #1f6fe5;
      --secondary: #e5e7eb;
      --secondary-text: #111827;
      --shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .top {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 22px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .top h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .top p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1.15rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 10px 20px rgba(47, 128, 237, 0.2);
    }

    .btn.primary:hover {
      background: var(--primary-dark);
    }

    .btn.secondary {
      background: var(--secondary);
      color: var(--secondary-text);
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 10px 22px 32px;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(0, 1.55fr);
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 1.7rem;
      letter-spacing: -0.03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .field input[type="text"],
    .field input[type="file"] {
      width: 100%;
      min-height: 42px;
      padding: 0.7rem 0.8rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
    }

    .field input[type="file"] {
      padding: 0.75rem 0.8rem;
      background: var(--panel-alt);
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 16px;
      min-height: 22px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .result-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100%;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .result-header h3 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }

    .result-header .muted {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 5px;
    }

    .slides {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 16px;
    }

    .slide {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .thumb {
      width: 100%;
      height: 150px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, #eef5ff, #f8fafc);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide strong {
      display: block;
      font-size: 0.95rem;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .slide pre {
      margin: 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      font-size: 0.8rem;
      line-height: 1.55;
      font-family: inherit;
    }

    .notes {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .notes strong {
      display: inline-block;
      margin-bottom: 6px;
    }

    @media (max-width: 860px) {
      .wrap {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>Studio IA de Treinamentos</h1>
      <p>Processamento real de arquivos PPTX</p>
    </div>
    <button id="newTraining" class="btn secondary" type="button">Novo treinamento</button>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Novo treinamento</h2>

      <form id="form">
        <div class="grid">
          <div class="field">
            <label>Nome do treinamento</label>
            <input id="name" name="name" type="text" value="Reciclagem Operação Segura" />
          </div>

          <div class="field">
            <label>Empresa ou unidade</label>
            <input id="unit" name="unit" type="text" value="CD-SP" />
          </div>

          <div class="field">
            <label>Categoria</label>
            <input id="category" name="category" type="text" value="Segurança e Saúde no Trabalho" />
          </div>

          <div class="field">
            <label>Público-alvo</label>
            <input id="audience" name="audience" type="text" value="Operadores de equipamentos" />
          </div>

          <div class="field">
            <label>Avatar</label>
            <input id="avatar" name="avatar" type="text" placeholder="Instrutor corporativo" />
          </div>

          <div class="field">
            <label>Voz</label>
            <input id="voice" name="voice" type="text" placeholder="Português BR didática" />
          </div>

          <div class="field">
            <label>Proporção do vídeo</label>
            <input id="aspectRatio" name="aspectRatio" type="text" value="16:9" />
          </div>

          <div class="field">
            <label>Duração máxima por vídeo</label>
            <input id="duration" name="duration" type="text" placeholder="Ex.: 90s" />
          </div>

          <div class="field">
            <label>Quantidade de vídeos</label>
            <input id="videoCount" name="videoCount" type="text" placeholder="Ex.: 12" />
          </div>

          <div class="field">
            <label>Arquivo PPTX</label>
            <input id="pptx" name="pptx" type="file" accept=".pptx" />
          </div>

          <div class="field">
            <label>Logotipo</label>
            <input id="logo" name="logo" type="file" accept="image/*" />
          </div>
        </div>

        <div class="actions">
          <button id="btnProcessLocal" class="btn primary" type="button">Processar PPTX</button>
          <button id="btnUploadServer" class="btn secondary" type="button">Enviar ao servidor</button>
        </div>
      </form>

      <div id="status" class="status">Aguardando arquivo .pptx</div>
    </section>

    <section id="result" class="card result-panel" aria-live="polite">
      <div class="result-header">
        <div>
          <h3 id="projectTitle">Nenhum projeto</h3>
          <div id="summary" class="muted">Selecione um arquivo PPTX para iniciar a extração.</div>
        </div>
        <button id="downloadJson" class="btn primary" type="button" disabled>Baixar JSON</button>
      </div>

      <div id="slides" class="slides"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fast-xml-parser@4.5.0/dist/fast-xml-parser.min.js"></script>

  <script>
    const form = document.getElementById('form');
    const statusEl = document.getElementById('status');
    const slidesEl = document.getElementById('slides');
    const projectTitle = document.getElementById('projectTitle');
    const summaryEl = document.getElementById('summary');
    const downloadJson = document.getElementById('downloadJson');
    const pptxInput = document.getElementById('pptx');
    const logoInput = document.getElementById('logo');
    const btnProcessLocal = document.getElementById('btnProcessLocal');
    const btnUploadServer = document.getElementById('btnUploadServer');
    const newTrainingBtn = document.getElementById('newTraining');

    const arrayWrap = value => value == null ? [] : Array.isArray(value) ? value : [value];

    const detectMime = (name) => {
      const ext = (name || '').split('.').pop().toLowerCase();
      return {
        png: 'image/png',
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        gif: 'image/gif',
        bmp: 'image/bmp',
        svg: 'image/svg+xml',
        webp: 'image/webp'
      }[ext] || 'application/octet-stream';
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[c]);
    }

    function extractTexts(obj, out = []) {
      if (obj == null) return out;
      if (Array.isArray(obj)) {
        obj.forEach(item => extractTexts(item, out));
        return out;
      }
      if (typeof obj !== 'object') return out;
      for (const [key, value] of Object.entries(obj)) {
        if (key === 'a:t' || key.endsWith(':t')) {
          arrayWrap(value).forEach(item => out.push(String(item)));
        } else {
          extractTexts(value, out);
        }
      }
      return out;
    }

    function normalizeZipPath(base, target) {
      if (!target) return '';
      let clean = decodeURIComponent(String(target)).replace(/\\/g, '/').replace(/^\//, '');
      if (clean.startsWith('ppt/')) return clean;
      return base.replace(/\/$/, '') + '/' + clean;
    }

    async function parsePptxFile(file) {
      const buffer = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buffer);
      const names = Object.keys(zip.files);
      const slideFiles = names.filter(name => /^ppt\/slides\/slide\d+\.xml$/.test(name))
        .sort((a, b) => {
          const na = Number(a.match(/slide(\d+)/)?.[1] || 0);
          const nb = Number(b.match(/slide(\d+)/)?.[1] || 0);
          return na - nb;
        });

      if (!slideFiles.length) throw new Error('Nenhum slide foi encontrado no arquivo PPTX.');

      const XMLParser = window.fastXmlParser?.XMLParser || window.XMLParser;
      const parser = new XMLParser({ ignoreAttributes: false, attributeNamePrefix: '', trimValues: false });

      const slides = [];

      for (const slideFile of slideFiles) {
        const number = Number(slideFile.match(/slide(\d+)/)?.[1] || 0);
        const slideXml = await zip.file(slideFile).async('string');
        const slideDoc = parser.parse(slideXml || '');
        const paragraphs = extractTexts(slideDoc)
          .map(text => text.replace(/\s+/g, ' ').trim())
          .filter(Boolean);

        const baseName = slideFile.split('/').pop();
        const relPath = `ppt/slides/_rels/${baseName}.rels`;
        const relXml = zip.file(relPath) ? await zip.file(relPath).async('string') : null;
        const relDoc = relXml ? parser.parse(relXml) : {};
        const relationships = arrayWrap(relDoc.Relationships?.Relationship);

        const images = [];
        for (const rel of relationships) {
          if (!String(rel.Type || '').endsWith('/image')) continue;
          if (rel.TargetMode === 'External') continue;
          const target = normalizeZipPath('ppt/slides', rel.Target);
          const imgFile = zip.file(target);
          if (!imgFile) continue;
          const arrayBuffer = await imgFile.async('arraybuffer');
          const blob = new Blob([arrayBuffer], { type: detectMime(target) });
          const url = URL.createObjectURL(blob);
          images.push({ path: target, url, mime: detectMime(target) });
        }

        let notes = '';
        const notesRel = relationships.find(r => String(r.Type || '').endsWith('/notesSlide'));
        if (notesRel?.Target) {
          try {
            const notesPath = normalizeZipPath('ppt/slides', notesRel.Target);
            const notesXml = zip.file(notesPath) ? await zip.file(notesPath).async('string') : null;
            if (notesXml) {
              const notesDoc = parser.parse(notesXml);
              notes = extractTexts(notesDoc)
                .map(text => text.replace(/\s+/g, ' ').trim())
                .filter(Boolean)
                .join(' ');
            }
          } catch (error) {
            // ignora erro de notas
          }
        }

        slides.push({
          number,
          title: paragraphs[0] || `Slide ${number}`,
          text: paragraphs.join(' '),
          notes,
          images
        });
      }

      return { slides, slideCount: slides.length };
    }

    function renderProject(fileName, result) {
      projectTitle.textContent = fileName;
      summaryEl.textContent = `${result.slideCount} slides processados`;
      slidesEl.innerHTML = '';

      for (const slide of result.slides) {
        const article = document.createElement('article');
        article.className = 'slide';
        article.innerHTML = `
          <div class="thumb">
            ${slide.images[0] ? `<img src="${slide.images[0].url}" alt="Slide ${slide.number}">` : 'Sem imagem'}
          </div>
          <div>
            <strong>${escapeHtml(slide.title)}</strong>
            <pre>${escapeHtml(slide.text || '[sem texto]')}</pre>
            ${slide.notes ? `<div class="notes"><strong>Notas:</strong><pre>${escapeHtml(slide.notes)}</pre></div>` : ''}
          </div>
        `;
        slidesEl.appendChild(article);
      }

      downloadJson.disabled = false;
      downloadJson._data = {
        fileName: fileName.replace(/\.pptx$/i, '') + '.json',
        content: { file: fileName, slides: result.slides }
      };
    }

    async function processLocalHandler() {
      const file = pptxInput.files && pptxInput.files[0];
      if (!file) {
        statusEl.textContent = 'Selecione um arquivo PPTX.';
        return;
      }

      try {
        statusEl.textContent = 'Processando arquivo...';
        const result = await parsePptxFile(file);
        renderProject(file.name, result);
        statusEl.textContent = `Concluído: ${result.slideCount} slides extraídos.`;
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Erro: ' + (error.message || error);
      }
    }

    async function sendToServerHandler() {
      const file = pptxInput.files && pptxInput.files[0];
      if (!file) {
        statusEl.textContent = 'Selecione um arquivo PPTX antes de enviar.';
        return;
      }

      const formData = new FormData();
      formData.append('pptx', file, file.name);

      const logo = logoInput.files && logoInput.files[0];
      if (logo) formData.append('logo', logo, logo.name);

      ['name', 'unit', 'category', 'audience', 'avatar', 'voice', 'aspectRatio'].forEach(key => {
        formData.append(key, form.elements[key].value || '');
      });

      try {
        statusEl.textContent = 'Enviando ao servidor...';
        const response = await fetch('/api/projects', { method: 'POST', body: formData });
        if (!response.ok) {
          throw new Error(`Servidor respondeu ${response.status}`);
        }

        const project = await response.json();
        statusEl.textContent = `Projeto enviado e salvo com sucesso (id: ${project.id}).`;
        renderProject(project.source?.filename || file.name, {
          slides: project.slides || [],
          slideCount: project.slideCount || (project.slides ? project.slides.length : 0)
        });
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'Falha ao enviar ao servidor: ' + (error.message || error);
      }
    }

    btnProcessLocal.addEventListener('click', processLocalHandler);
    btnUploadServer.addEventListener('click', sendToServerHandler);
    newTrainingBtn.addEventListener('click', () => {
      pptxInput.value = '';
      logoInput.value = '';
      slidesEl.innerHTML = '';
      projectTitle.textContent = 'Nenhum projeto';
      summaryEl.textContent = 'Selecione um arquivo PPTX para iniciar a extraição.';
      statusEl.textContent = 'Aguardando arquivo .pptx';
      downloadJson.disabled = true;
    });

    downloadJson.addEventListener('click', () => {
      const data = downloadJson._data;
      if (!data) return;
      const blob = new Blob([JSON.stringify(data.content, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = data.fileName;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
